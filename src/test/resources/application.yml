# Perfil usado apenas pelo teste de contexto.
spring:
  application:
    name: shopfast-app
  datasource:
    url: jdbc:h2:mem:shopfast;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: shopfast123
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
    io.shopfast: WARN
