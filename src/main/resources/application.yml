spring:
  application:
    name: shopfast-app
  datasource:
    url: jdbc:h2:mem:shopfast;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    # VULN (java:S6437 / java:S2068): credenciais do banco versionadas no repositorio.
    username: sa
    password: shopfast123
  jpa:
    hibernate:
      ddl-auto: none
    # VULN (didatica): SQL exposto em log. Mantido para o Modulo 3.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      # VULN (didatica): console web do banco habilitado. Mantido para o Modulo 3.
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

server:
  port: 8080
  error:
    # VULN (didatica): stacktrace devolvido ao cliente. Mantido para o Modulo 3.
    include-message: always
    include-stacktrace: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        # VULN (didatica): Actuator inteiramente exposto. Mantido para o Modulo 3.
        include: "*"
  endpoint:
    health:
      show-details: always
    env:
      show-values: always

# Contrato OpenAPI servido pela propria aplicacao.
# O ZAP importa /v3/api-docs e passa a conhecer rotas, verbos, query params e
# corpos — sem isso o spider nao acha nada numa API REST (nao ha links HTML).
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  # Inclui os endpoints do Actuator no contrato, para o ZAP atacar tambem eles.
  show-actuator: true

logging:
  level:
    root: INFO
    io.shopfast: DEBUG
    org.springframework.security: DEBUG

