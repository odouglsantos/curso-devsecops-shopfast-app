spring:
  application:
    name: shopfast-app
  datasource:
    url: jdbc:h2:mem:shopfast;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    # Credenciais vem do ambiente; nada de senha versionada no repositorio.
    username: ${SHOPFAST_DB_USER:sa}
    password: ${SHOPFAST_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    # SQL fora do log: a query carrega dado de cliente.
    show-sql: false
  sql:
    init:
      mode: always
  h2:
    console:
      # Console web do banco desligado: dava shell de SQL sem autenticacao.
      enabled: false

server:
  port: 8080
  error:
    # Sem stacktrace, sem mensagem interna e sem detalhe de binding na resposta:
    # tudo isso entregava versao de biblioteca, caminho interno e estrutura do banco.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # So o health fica aberto (ver SecurityConfig); o resto exige ADMIN.
        include: health
  endpoint:
    health:
      show-details: when-authorized
    env:
      show-values: never

# Contrato OpenAPI servido pela propria aplicacao.
# O ZAP importa /v3/api-docs e passa a conhecer rotas, verbos, query params e
# corpos — sem isso o spider nao acha nada numa API REST (nao ha links HTML).
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: false

logging:
  level:
    root: INFO
    io.shopfast: INFO
    org.springframework.security: INFO

shopfast:
  # Segredos vem do ambiente. Sem a variavel definida, a aplicacao sorteia um
  # valor aleatorio na subida (ver AppProperties) — o repositorio nunca carrega
  # segredo de producao.
  jwt-secret: ${SHOPFAST_JWT_SECRET:}
  payment-api-key: ${SHOPFAST_PAYMENT_API_KEY:}
  encryption-key: ${SHOPFAST_ENCRYPTION_KEY:}
  webhook-signing-secret: ${SHOPFAST_WEBHOOK_SECRET:}
  billing-base-url: ${SHOPFAST_BILLING_BASE_URL:https://billing.internal.shopfast.io}
  partner-webhook: ${SHOPFAST_PARTNER_WEBHOOK:https://partners.shopfast.io/webhooks/orders}
  report-directory: ${SHOPFAST_REPORT_DIR:/var/shopfast/reports}
  # Listas brancas: vazio = nada liberado. CORS e destino de webhook (anti-SSRF).
  allowed-origins: ${SHOPFAST_ALLOWED_ORIGINS:}
  allowed-webhook-hosts: ${SHOPFAST_ALLOWED_WEBHOOK_HOSTS:partners.shopfast.io}
