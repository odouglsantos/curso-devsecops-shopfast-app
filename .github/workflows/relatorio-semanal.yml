name: Relatorio Semanal - ShopFast

on:
  schedule:
    # Demonstracao: a cada 5 minutos. Em producao, use "0 9 * * 1" (segunda, 09h UTC).
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  relatorio-semanal:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      actions: read
      vulnerability-alerts: read
    steps:
      - name: Contagem SonarQube por severidade
        run: |
          HOST="${SONAR_HOST_URL%/}"

          HTTP=$(curl -s -o sonar.json -w '%{http_code}' -u "$SONAR_TOKEN:" \
            "$HOST/api/issues/search?componentKeys=shopfast-app&resolved=false") || HTTP="000"

          if [ "$HTTP" = "200" ] && jq -e '.issues' sonar.json >/dev/null 2>&1; then
            jq -r '.issues | group_by(.severity)
                   | map("  \(.[0].severity): \(length)") | .[]' \
              sonar.json > sonar-contagem.txt
          else
            echo "::warning::SonarQube respondeu HTTP $HTTP com conteudo nao-JSON"
            head -c 200 sonar.json || true
            echo "  (indisponivel - HTTP $HTTP)" > sonar-contagem.txt
          fi

          [ -s sonar-contagem.txt ] || echo "  Nenhum achado em aberto" > sonar-contagem.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Contagem Dependabot por severidade
        run: |
          if gh api "repos/${{ github.repository }}/dependabot/alerts" > dependabot.json 2> dependabot.err; then
            jq -r '[.[] | select(.state=="open")] | group_by(.security_advisory.severity)
                   | map("  \(.[0].security_advisory.severity): \(length)") | .[]' \
              dependabot.json > dependabot-contagem.txt
          else
            echo "::warning::Dependabot indisponivel: $(cat dependabot.err)"
            echo "  (indisponivel)" > dependabot-contagem.txt
          fi

          [ -s dependabot-contagem.txt ] || echo "  Nenhum alerta em aberto" > dependabot-contagem.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contagem OWASP ZAP por risco
        run: |
          RUN_ID=$(gh run list --workflow=main.yml --branch=main --limit=1 \
            --json databaseId --jq '.[0].databaseId')

          if gh run download "$RUN_ID" --name zap-report --dir zap; then
            jq -r '[.site[].alerts[]] | group_by(.riskdesc | split(" ")[0])
                   | map("  \(.[0].riskdesc | split(" ")[0]): \(length)") | .[]' \
              zap/report_json.json > zap-contagem.txt
          else
            echo "  (sem relatorio do ZAP na execucao $RUN_ID)" > zap-contagem.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Montar relatorio consolidado
        run: |
          {
            echo "Relatorio Semanal de Seguranca - ShopFast"
            echo "Gerado em: $(date +%d/%m/%Y)"
            echo ""
            echo "SonarQube (SAST):"
            cat sonar-contagem.txt
            echo ""
            echo "OWASP ZAP (DAST):"
            cat zap-contagem.txt
            echo ""
            echo "Dependabot (SCA):"
            cat dependabot-contagem.txt
          } > relatorio-semanal.txt

          {
            echo '```'
            cat relatorio-semanal.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload do relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semanal
          path: relatorio-semanal.txt
